# =============================================================================
# Habot Connect FZCO - Hiring Project
# Position: Junior Cloud and Development Operations Engineer
# Candidate Full Name: Anuradha
# Candidate Electronic Mail Address: anuradha@tecofize.com
# File Purpose: The fail closed build gate. Task two of the hiring project.
# =============================================================================
#
# THE GOVERNING RULE OF THIS FILE
#
# This pipeline is fail closed. A check that does not pass halts the build. A
# check that cannot run halts the build. A check that is skipped halts the
# build. There is no path through this file that reaches the deployment stage
# without every gate having reported success.
#
# The four structural rules that make that true are stated here so that a
# reviewer can verify them by reading rather than by trusting:
#
#   Rule one.   The string continue-on-error does not appear anywhere in this
#               file. A step that fails stops its job.
#
#   Rule two.   Every run step executes under bash with the options e, u and
#               pipefail set. Without pipefail a failing command inside a pipe
#               is masked by the exit status of the last command in the pipe,
#               which is the single most common way a linter appears to pass
#               while actually having failed.
#
#   Rule three. Every job that follows the gate declares needs on the gate and
#               declares an if condition of success. GitHub Actions skips a
#               dependent job when its dependency fails, and a skipped job is
#               reported as neutral rather than as a failure, so the explicit
#               success condition is what prevents a neutral result from being
#               read as permission to proceed.
#
#   Rule four.  The final job named required-status-check exists for one reason
#               only. It fails unless every gate job reported the literal result
#               success. Branch protection requires this one job. An engineer
#               who adds a new gate job without adding it here is caught by the
#               completeness assertion inside that job.
#
# The corresponding repository side control is documented in
# docs/BRANCH_PROTECTION_CONFIGURATION.md. A pipeline that can be merged around
# is a recommendation, not a gate.

name: Poka Yoke Automated Build Gate

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

# The default token is read only. A step that needs to write must ask for the
# permission it needs, in the job that needs it, and nowhere else.
permissions:
  contents: read

# A superseded run is cancelled so that an older run cannot report success
# against a newer commit.
concurrency:
  group: poka-yoke-build-gate-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

env:
  PYTHON_VERSION: "3.11"
  TERRAFORM_VERSION: "1.9.8"
  TERRAFORM_DIRECTORY: task-01-terraform-secure-staging-provisioning
  PYTHON_SOURCE_DIRECTORY: task-03-schema-mapping-and-data-validation

jobs:
  # ---------------------------------------------------------------------------
  # GATE ONE. SECRET DETECTION AND QUARANTINE.
  #
  # This job runs first and every other job depends on it. The reasoning is that
  # a commit carrying a credential must never reach a stage that could publish a
  # build artefact, a log line or a cache entry derived from it. Detection has
  # to happen before anything else touches the code.
  # ---------------------------------------------------------------------------
  secret-detection-and-quarantine:
    name: Gate one. Secret detection and quarantine
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out the full commit history
        uses: actions/checkout@v4
        with:
          # The full history is required. Scanning only the tip commit would
          # miss a credential that was committed earlier in the branch and then
          # removed in a later commit, which still leaves it recoverable.
          fetch-depth: 0

      - name: Scan the full commit history for credentials
        env:
          GITLEAKS_CONFIG: .gitleaks.toml
        run: |
          echo "Installing the secret scanner at a pinned version."
          GITLEAKS_VERSION="8.21.2"
          curl --silent --show-error --fail --location \
            --output gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar --extract --gzip --file gitleaks.tar.gz gitleaks
          chmod +x gitleaks

          echo "Scanning the full commit history."
          ./gitleaks detect \
            --source . \
            --config "${GITLEAKS_CONFIG}" \
            --report-format sarif \
            --report-path gitleaks-findings.sarif \
            --redact \
            --exit-code 1 \
            --verbose

      - name: Confirm that the scan produced a report
        run: |
          # A scanner that exits zero because it never ran is the failure mode
          # that this step exists to catch. The absence of a report is treated
          # as a failure, not as a pass.
          if [[ ! -f gitleaks-findings.sarif ]]; then
            echo "FAIL CLOSED. The secret scanner produced no report file."
            echo "The build is halted because the absence of evidence is not evidence of absence."
            exit 1
          fi
          echo "The secret scanner produced a report and found no credential."

      - name: Quarantine the commit when a credential is detected
        if: failure()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          QUARANTINE_BRANCH: quarantine/${{ github.sha }}
        run: |
          echo "::error title=Build quarantined::A credential was detected in this commit. The build is halted."
          echo "The commit ${GITHUB_SHA} is quarantined."
          echo "The offending reference is not printed, because printing it would copy the credential into the build log."
          echo "Required remediation, in this order:"
          echo "  1. Treat the credential as compromised and rotate it at its issuer immediately."
          echo "  2. Remove the credential from the commit history, not merely from the working tree."
          echo "  3. Move the value into Google Secret Manager and read it at run time."
          echo "  4. Push again. The gate re-runs automatically."
          exit 1

  # ---------------------------------------------------------------------------
  # GATE TWO. INFRASTRUCTURE AS CODE FORMATTING, LINTING AND VALIDATION.
  # ---------------------------------------------------------------------------
  infrastructure-as-code-gate:
    name: Gate two. Infrastructure as code
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: secret-detection-and-quarantine
    if: ${{ needs.secret-detection-and-quarantine.result == 'success' }}

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install Terraform at the pinned version
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Assert that the formatting is canonical
        working-directory: ${{ env.TERRAFORM_DIRECTORY }}
        run: |
          # The check flag makes this a gate rather than a rewrite. A pipeline
          # that silently reformats the code hides the fact that the author
          # never ran the formatter, and the next author inherits the noise.
          if ! terraform fmt -check -recursive -diff -no-color; then
            echo "::error title=Formatting gate failed::The Terraform configuration is not in canonical format."
            echo "FAIL CLOSED. Run the command terraform fmt -recursive and commit the result."
            exit 1
          fi
          echo "The Terraform configuration is in canonical format."

      - name: Initialise without a backend
        working-directory: ${{ env.TERRAFORM_DIRECTORY }}
        run: |
          # The backend is deliberately disabled. Validation must not require
          # credentials for the remote state bucket, because a gate that needs a
          # credential to run is a gate that gets disabled the first time the
          # credential expires.
          terraform init -backend=false -input=false -no-color

      - name: Validate the configuration against the provider schema
        working-directory: ${{ env.TERRAFORM_DIRECTORY }}
        run: |
          terraform validate -no-color

      - name: Lint the configuration
        working-directory: ${{ env.TERRAFORM_DIRECTORY }}
        run: |
          TFLINT_VERSION="0.54.0"
          curl --silent --show-error --fail --location \
            --output tflint.zip \
            "https://github.com/terraform-linters/tflint/releases/download/v${TFLINT_VERSION}/tflint_linux_amd64.zip"
          unzip -o -q tflint.zip
          chmod +x tflint
          ./tflint --init --config "${GITHUB_WORKSPACE}/.tflint.hcl"
          ./tflint --config "${GITHUB_WORKSPACE}/.tflint.hcl" --format compact --recursive

      - name: Assert that no forbidden identity and access management role is used
        working-directory: ${{ env.TERRAFORM_DIRECTORY }}
        run: |
          # This is a structural assertion rather than a lint rule. The three
          # roles below grant so much that no correct configuration in this
          # repository can need them. Searching for them is cheap and the
          # failure is unambiguous.
          FORBIDDEN_ROLES=("roles/owner" "roles/editor" "roles/storage.admin")
          FAILURE_DETECTED="no"
          for ROLE in "${FORBIDDEN_ROLES[@]}"; do
            if grep --recursive --line-number --fixed-strings "\"${ROLE}\"" --include="*.tf" .; then
              echo "::error title=Least privilege gate failed::The role ${ROLE} is forbidden in this repository."
              FAILURE_DETECTED="yes"
            fi
          done
          if [[ "${FAILURE_DETECTED}" == "yes" ]]; then
            echo "FAIL CLOSED. Replace the forbidden role with the narrowest role that satisfies the requirement."
            exit 1
          fi
          echo "No forbidden identity and access management role is present."

      - name: Assert that no storage bucket permits public access
        working-directory: ${{ env.TERRAFORM_DIRECTORY }}
        run: |
          BUCKET_COUNT="$(grep --recursive --count 'resource "google_storage_bucket"' --include="*.tf" . | awk -F: '{ total += $2 } END { print total + 0 }')"
          ENFORCED_COUNT="$(grep --recursive --count 'public_access_prevention *= *"enforced"' --include="*.tf" . | awk -F: '{ total += $2 } END { print total + 0 }')"
          UNIFORM_COUNT="$(grep --recursive --count 'uniform_bucket_level_access *= *true' --include="*.tf" . | awk -F: '{ total += $2 } END { print total + 0 }')"

          echo "Storage buckets declared: ${BUCKET_COUNT}"
          echo "Buckets with public access prevention enforced: ${ENFORCED_COUNT}"
          echo "Buckets with uniform bucket level access enabled: ${UNIFORM_COUNT}"

          if [[ "${BUCKET_COUNT}" -eq 0 ]]; then
            echo "::error title=Assertion gate failed::No storage bucket was found, so this assertion cannot be meaningful."
            echo "FAIL CLOSED. An assertion that has nothing to assert against is treated as a failure."
            exit 1
          fi
          if [[ "${ENFORCED_COUNT}" -ne "${BUCKET_COUNT}" || "${UNIFORM_COUNT}" -ne "${BUCKET_COUNT}" ]]; then
            echo "::error title=Public access gate failed::Every storage bucket must set public access prevention to enforced and uniform bucket level access to true."
            echo "FAIL CLOSED."
            exit 1
          fi
          echo "Every storage bucket is closed to public access."

  # ---------------------------------------------------------------------------
  # GATE THREE. APPLICATION FORMATTING, LINTING, SECURITY AND TESTS.
  # ---------------------------------------------------------------------------
  application-code-gate:
    name: Gate three. Application code
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: secret-detection-and-quarantine
    if: ${{ needs.secret-detection-and-quarantine.result == 'success' }}

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install Python at the pinned version
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install the pinned development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --requirement requirements-development.txt

      - name: Assert that the formatting is canonical
        run: |
          if ! black --check --diff .; then
            echo "::error title=Formatting gate failed::The Python source is not in canonical format."
            echo "FAIL CLOSED. Run the command black . and commit the result."
            exit 1
          fi
          echo "The Python source is in canonical format."

      - name: Assert that the import ordering is canonical
        run: |
          isort --check-only --diff .

      - name: Lint the Python source
        run: |
          flake8 .

      - name: Scan the Python source for insecure constructs
        run: |
          # Bandit is the second, independent line of defence against a hard
          # coded credential. The secret scanner looks for values that match the
          # shape of a credential. Bandit looks for the code patterns that hold
          # them. Neither alone is sufficient.
          # The test directory is excluded for one stated reason only: the
          # assert statement is the idiom of a test, and the scanner reports
          # every assert as a low severity finding. Nothing else is excluded,
          # and the exclusion is narrow enough that a reviewer can see what it
          # covers.
          bandit --recursive \
            "${PYTHON_SOURCE_DIRECTORY}" \
            scripts \
            conftest.py \
            --exclude "${PYTHON_SOURCE_DIRECTORY}/tests" \
            --severity-level low \
            --confidence-level low

      - name: Run the validation test suite
        run: |
          pytest --verbose --strict-markers --strict-config

      - name: Assert that the test suite is not empty
        run: |
          COLLECTED_TEST_COUNT="$(pytest --collect-only --quiet | tail -n 1 | grep --only-matching '^[0-9]\+' || echo "0")"
          echo "Tests collected: ${COLLECTED_TEST_COUNT}"
          if [[ "${COLLECTED_TEST_COUNT}" -lt 20 ]]; then
            echo "::error title=Test coverage gate failed::Fewer than twenty tests were collected."
            echo "FAIL CLOSED. A validation library without a test suite is an assertion, not a control."
            exit 1
          fi
          echo "The test suite is present and of adequate size."

  # ---------------------------------------------------------------------------
  # GATE FOUR. SCHEMA CONSISTENCY BETWEEN THE APPLICATION AND THE WAREHOUSE.
  #
  # This gate exists because of the second half of the incident. A schema
  # mismatch broke downstream analytics. The mismatch was possible because the
  # serializer and the BigQuery table were two documents that a person was
  # expected to keep in step. This gate makes the machine keep them in step.
  # ---------------------------------------------------------------------------
  schema-consistency-gate:
    name: Gate four. Schema consistency
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: secret-detection-and-quarantine
    if: ${{ needs.secret-detection-and-quarantine.result == 'success' }}

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install Python at the pinned version
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install the pinned development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --requirement requirements-development.txt

      - name: Assert that the serializer and the warehouse schema agree
        run: |
          python scripts/assert_schema_consistency.py

  # ---------------------------------------------------------------------------
  # THE REQUIRED STATUS CHECK.
  #
  # Branch protection requires this job and only this job. It fails unless every
  # gate reported the literal result success. A cancelled, skipped or neutral
  # result is a failure here, which is what closes the gap that dependent job
  # skipping would otherwise open.
  # ---------------------------------------------------------------------------
  required-status-check:
    name: Required status check
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # The always condition is essential. Without it this job would itself be
    # skipped when a gate failed, and a skipped required check can be reported
    # as satisfied.
    if: ${{ always() }}
    needs:
      - secret-detection-and-quarantine
      - infrastructure-as-code-gate
      - application-code-gate
      - schema-consistency-gate

    steps:
      - name: Assert that every gate reported success
        env:
          GATE_RESULTS_AS_JSON: ${{ toJSON(needs) }}
        run: |
          echo "Reported gate results:"
          echo "${GATE_RESULTS_AS_JSON}"

          # The completeness assertion. If a new gate job is added to this
          # workflow and is not added to the needs list above, the count below
          # will not match the expected number and the build halts. This is what
          # stops the required status check from decaying into a check of a
          # subset of the gates.
          EXPECTED_GATE_COUNT=4
          REPORTED_GATE_COUNT="$(echo "${GATE_RESULTS_AS_JSON}" | python3 -c 'import json,sys; print(len(json.load(sys.stdin)))')"
          if [[ "${REPORTED_GATE_COUNT}" -ne "${EXPECTED_GATE_COUNT}" ]]; then
            echo "::error title=Completeness assertion failed::Expected ${EXPECTED_GATE_COUNT} gates but ${REPORTED_GATE_COUNT} reported."
            echo "FAIL CLOSED. A gate has been added or removed without updating the required status check."
            exit 1
          fi

          FAILED_GATE_COUNT="$(echo "${GATE_RESULTS_AS_JSON}" | python3 -c 'import json,sys; print(sum(1 for gate in json.load(sys.stdin).values() if gate["result"] != "success"))')"
          if [[ "${FAILED_GATE_COUNT}" -ne 0 ]]; then
            echo "::error title=Build gate closed::${FAILED_GATE_COUNT} gate or gates did not report success."
            echo "FAIL CLOSED. This commit is not permitted to merge or to deploy."
            exit 1
          fi

          echo "Every gate reported success. This commit is permitted to proceed."

  # ---------------------------------------------------------------------------
  # DEPLOYMENT. Reached only from the main branch and only behind the required
  # status check. The environment named production-staging carries a manual
  # reviewer requirement configured in the repository settings, so even a green
  # build cannot reach the estate without a named human approving it.
  # ---------------------------------------------------------------------------
  deploy-to-staging-estate:
    name: Deploy to the staging estate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: required-status-check
    if: ${{ needs.required-status-check.result == 'success' && github.ref == 'refs/heads/main' && github.event_name == 'push' }}
    environment: production-staging

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Obtain short lived credentials through workload identity federation
        uses: google-github-actions/auth@v2
        with:
          # No service account key file exists anywhere in this system. The
          # pipeline exchanges its own signed token for a short lived Google
          # Cloud credential. A key that does not exist cannot be committed,
          # which is the structural answer to the incident this project
          # responds to.
          workload_identity_provider: projects/418293046517/locations/global/workloadIdentityPools/github-actions-pool/providers/github-actions-provider
          service_account: terraform-deployer@habotconnect-lsa-platform-staging.iam.gserviceaccount.com

      - name: Install Terraform at the pinned version
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Produce and apply the execution plan
        working-directory: ${{ env.TERRAFORM_DIRECTORY }}
        run: |
          terraform init -input=false -no-color
          terraform plan -input=false -no-color -out=execution.tfplan
          terraform apply -input=false -no-color -auto-approve execution.tfplan
