#
# Poka-Yoke rationale for this file:
# The ignore list is short and every entry states why it is there. A long
# unexplained ignore list is how a linter stops finding anything.

[flake8]
max-line-length = 88
max-complexity = 10

# E203 disagrees with the formatter about whitespace before a colon in a slice.
# The formatter is the authority, so this one check is disabled rather than
# fighting the formatter on every commit.
# W503 forbids a line break before a binary operator, which is the style the
# formatter produces. The same reasoning applies.
extend-ignore = E203, W503

exclude =
    .git,
    .github,
    __pycache__,
    .pytest_cache,
    .terraform,
    .venv

# A file that declares no docstring is a file the next engineer has to read in
# full to understand, so the docstring checks are left on.
per-file-ignores =
    task-03-schema-mapping-and-data-validation/tests/*: E501
